name: Release to CurseForge

# 正式版：仅在推送 v* tag 时打包（当前提交落在 tag 上 → CurseForge Release）
# 发版命令:
#   .\release.cmd           # toc 最小段 +1
#   .\release.cmd 0.1.4     # 指定版本

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: 要重新发布的已有 tag（如 v0.1.4）
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Verify tagged commit (release, not alpha)
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          if [[ "${TAG,,}" == *alpha* ]] || [[ "${TAG,,}" == *beta* ]]; then
            echo "::error::tag ${TAG} 含 alpha/beta，不能作为正式版。请使用 v0.1.4 这类名字。"
            exit 1
          fi
          POINTS=$(git tag --points-at HEAD || true)
          if ! grep -qxF "$TAG" <<<"$POINTS"; then
            echo "::error::HEAD 未指向 tag ${TAG}（points-at: ${POINTS:-无}）。拒绝上传以免变成 Alpha。"
            exit 1
          fi
          if [ -z "${{ secrets.CF_API_KEY }}" ]; then
            echo "::error::缺少 GitHub Secret CF_API_KEY"
            exit 1
          fi
          if ! grep -qE '^## X-Curse-Project-ID:[[:space:]]*[1-9][0-9]*' BGLite_Plus.toc; then
            echo "::error::请在 BGLite_Plus.toc 增加: ## X-Curse-Project-ID: <数字ID>"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "正式版发布: ${TAG} @ $(git rev-parse --short HEAD)"

      - name: Package and publish to CurseForge
        uses: BigWigsMods/packager@v2
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
